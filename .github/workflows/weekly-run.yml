name: Agente Semanal de Conteúdo LinkedIn

on:
  schedule:
    # Executa todo domingo às 23:00 UTC (20:00 no Horário de Brasília)
    - cron: '0 23 * * 0'
  workflow_dispatch: # Permite execução manual a qualquer momento

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar LinkedIn Content Agent
        env:
          PYTHONUNBUFFERED: "1"
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN || secrets.NOTION_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY || secrets.NOTION_TOKEN }}
          NOTION_DATABASE_IDEAS_ID: ${{ secrets.NOTION_DATABASE_IDEAS_ID || secrets.NOTION_DATABASE_IDEIAS_ID }}
          NOTION_DATABASE_IDEIAS_ID: ${{ secrets.NOTION_DATABASE_IDEIAS_ID || secrets.NOTION_DATABASE_IDEAS_ID }}
          NOTION_DATABASE_KNOWLEDGE_ID: ${{ secrets.NOTION_DATABASE_KNOWLEDGE_ID || secrets.NOTION_DATABASE_BASE_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python src/main.py